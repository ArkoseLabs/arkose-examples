<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CDN Integration - Button Takeover Example</title>
    <!-- Javascript to inject in the page header -->
    <!-- Replace <YOUR_PUBLIC_KEY> with the public key that has been setup for your account -->
    <script
        src="https://client-api.arkoselabs.com/v2/<YOUR_PUBLIC_KEY>/api.js"
        data-callback="setupEnforcement"
        async
    ></script>
    <!---->
    <style>
        form { width: 10em; margin: 1em auto; }
        form .formField { margin: 0.5em 0 }
    </style>
  </head>
  <body>
    <form action="" method="post" id="submitForm">
        <h2>Login</h2>
        <div class="formField">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Username" />
        </div>
        <div class="formField">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Password" />
        </div>
        <div class="formField">
            <input type="submit" value="Submit" id="submitButton" />
        </div>
    </form>
    <!-- Javascript to inject before the closing body tag -->
    <script>
        let arkoseReady = false; // Flag for checking if CAPI has called onReady
        let arkoseComplete = false; // Flag to signify the challenge being completed
        let arkoseResetting = false; // Flag to signify when the challenge is being reset
        let arkose; // Arkose Enforcement Object
        let arkoseRetry = 0; // Counter for Retries

        // The following variables can be changed
        const arkoseMaxRetryCount = 2; // The number of retries to perform when there is an error
        const arkoseCookieName = 'arkoseToken'; // The name of the cookie that the Arkose token will be stored in
        const arkoseErrorCookieName = 'arkoseError'; // The name of the cookie that an Arkose error will be stored in
        const arkoseCookieLife = 5 * 60 * 1000;  // The length of time that the cookie should be active for, 5 mins is the default
        const buttonSelector = '#submitButton'; // The querySelector string used for selecting the required button to protect

        const button = document.querySelector(buttonSelector);
        setupButton();

        /**
        * Sets up the events for hijacking the button click
        */
        function setupButton() {
            if (button) {
                arkoseComplete = false;
                if (!arkoseReady) {
                    button.setAttribute('disabled', true);
                }
                button.addEventListener('click', (event) => {
                    if (!arkoseReady) {
                        event.preventDefault();
                        return;
                    }
                    if (!arkoseComplete) {
                        event.preventDefault();
                        arkose.run();
                        return;
                    }
                })
            }
        }

        /**
        * Checks the current status of the Arkose Labs platform and invokes a callback with the result
        * @param  {function} callback The function to call once the status check has been performed
        */
        async function checkArkoseStatus(callback) {
            try {
                const res = await fetch('https://status.arkoselabs.com/api/v2/status.json');
                const data = await res.json();
                const status = data.status.indicator;
                callback(!(status === 'critical'));
            } catch (error) {
                callback(false);
            }
        }

        /**
        * In the case of an error reset the arkose cookie and setup a new cookie that tracks the error
        * @param  {string} error The error string to set in the error cookie
        */
        function handleError(error) {
            arkoseComplete = true;
            document.cookie = `${arkoseCookieName}=;expires=${new Date(Date.now() + arkoseCookieLife).toUTCString()}; path=/;`;
            document.cookie = `${arkoseErrorCookieName}=${error};expires=${new Date(Date.now() + arkoseCookieLife).toUTCString()}; path=/;`;
        }

         /**
        * The callback thats called after the Arkose Labs script has been loaded
        * @param  {object} myEnforcement The Arkose Labs enforcement object
        */
        function setupEnforcement(myEnforcement) {
            arkose = myEnforcement;
            arkose.setConfig({
                onReady: () => {
                    arkoseReady = true;
                    if (button) {
                        button.removeAttribute('disabled');
                    }
                    if (arkoseResetting) {
                        arkoseResetting = false;
                        arkose.run();
                    }
                    document.cookie = `${arkoseCookieName}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;`;
                    document.cookie = `${arkoseErrorCookieName}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;`;
                },
                onCompleted: (response) => {
                    arkoseComplete = true;
                    if (response.token){
                        document.cookie = `${arkoseCookieName}=${response.token};expires=${new Date(Date.now() + arkoseCookieLife).toUTCString()}; path=/;`;
                    } else {
                        handleError('TOKEN_MISSING');
                    }
                    button.click();
                },
                onError: (response) => {
                    checkArkoseStatus((isHealthy) => {
                        if (isHealthy && arkoseRetry < arkoseMaxRetryCount) {
                            arkoseReady = false;
                            arkoseResetting = true;
                            arkose.reset();
                            arkoseRetry = arkoseRetry + 1;
                            return;
                        }
                        handleError(response.error ? response.error.error : 'error');
                        button.removeAttribute('disabled');
                        button.click();
                    });
                }
            });
        }
    </script>
    <!---->
  </body>
</html>
