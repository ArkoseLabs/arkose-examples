<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi Hosted Iframe Test</title>
    <style>
      iframe {
        width: 0px;
        height: 0px;
        border: 0 !important;
        overflow-y: hidden;
      }
      body {
        display: flex;
        flex-direction: row;
        gap: 50px;
      }
    </style>
    <script>
      window.addEventListener('message', function(event) {
        if (!event.data || typeof event.data === 'object') return;

        if (event.origin !== 'https://iframe.arkoselabs.com') return;

        let json_parsed_event;
        try {
            json_parsed_event = JSON.parse(event.data);
        } catch {
            return;
        }

        // Replace <YOUR_PUBLIC_KEY_1> and <YOUR_PUBLIC_KEY_2> with the public keys that have been setup for your account
        const key_1 = "<YOUR_PUBLIC_KEY_1>";
        const key_2 = "<YOUR_PUBLIC_KEY_2>";

        const keyMap = {
            [key_1]: { frame: 'arkoseFrame1', token: 'token' },
            [key_2]: { frame: 'arkoseFrame2', token: 'token2' },
        };

        const entry = keyMap[json_parsed_event.publicKey];
        if (!entry) return;

        switch (json_parsed_event.eventId) {
            case 'challenge-loaded':
            case 'challenge-iframeSize':
                document.getElementById(entry.frame).style.height = json_parsed_event.payload.frameHeight;
                document.getElementById(entry.frame).style.width = json_parsed_event.payload.frameWidth;
                break;
            case 'challenge-complete':
                document.getElementById(entry.token).textContent = json_parsed_event.payload.sessionToken;
                break;
            case 'challenge-suppressed':
            case 'challenge-shown':
            case 'challenge-error':
                break;
        }
      });
    </script>
  </head>
  <body>
    <div>
      <h3>Key One</h3>
      <!-- Replace <YOUR_PUBLIC_KEY_1> with the public key assigned to key_1 -->
      <iframe id="arkoseFrame1" src="https://iframe.arkoselabs.com/<YOUR_PUBLIC_KEY_1>/index.html"></iframe>
      <p>&nbsp;</p>
      <div>
      <p><strong>Session Token:</strong><br /><span id="token">-</span></p>
      </div>
    </div>
    <div>
      <h3>Key Two</h3>
      <!-- Replace <YOUR_PUBLIC_KEY_2> with the public key assigned to key_2 -->
      <iframe id="arkoseFrame2" src="https://iframe.arkoselabs.com/<YOUR_PUBLIC_KEY_2>/index.html"></iframe>
      <p>&nbsp;</p>
      <div>
      <p><strong>Session Token:</strong><br /><span id="token2">-</span></p>
      </div>
    </div>
  </body>
</html>
